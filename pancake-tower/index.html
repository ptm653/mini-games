<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<title>まよなかパンケーキ — MIDNIGHT PANCAKE TOWER</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --night:#0b1230; --night2:#16295a; --dusk:#24507a;
    --cream:#fff3dc; --sub:#b9c6ec; --butter:#ffd75e; --crust:#c9803a; --batter:#f3cf8e;
    --berry:#ff6b7d; --mint:#6fe3c4; --ink:#3a2412; --wood:#5d3720;
    --panel:rgba(10,18,48,.66); --line:rgba(255,255,255,.16);
  }
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#060a1c;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    color:var(--cream);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  #app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;
    background:linear-gradient(180deg,var(--night) 0%,var(--night2) 48%,var(--dusk) 100%);}
  .screen{flex:1;min-height:0;display:none;flex-direction:column;position:relative;}
  .screen.on{display:flex;}
  .stars{position:absolute;inset:0;pointer-events:none;opacity:.9;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 9%,#fff 50%,transparent 51%),
      radial-gradient(1.2px 1.2px at 31% 22%,#fff 50%,transparent 51%),
      radial-gradient(1.8px 1.8px at 68% 6%,#ffe9a8 50%,transparent 51%),
      radial-gradient(1.2px 1.2px at 86% 17%,#fff 50%,transparent 51%),
      radial-gradient(1.4px 1.4px at 48% 13%,#fff 50%,transparent 51%),
      radial-gradient(1.2px 1.2px at 6% 34%,#fff 50%,transparent 51%),
      radial-gradient(1.6px 1.6px at 93% 41%,#ffe9a8 50%,transparent 51%),
      radial-gradient(1.2px 1.2px at 22% 52%,#fff 50%,transparent 51%),
      radial-gradient(1.3px 1.3px at 77% 58%,#fff 50%,transparent 51%),
      radial-gradient(1.2px 1.2px at 58% 31%,#fff 50%,transparent 51%);}

  /* ---------- buttons (fixed size, never depends on label length) ---------- */
  .btn{appearance:none;border:none;border-radius:16px;cursor:pointer;font-family:inherit;font-weight:800;
    width:264px;max-width:100%;height:58px;padding:0 16px;font-size:18px;line-height:1;letter-spacing:.04em;
    display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;flex:none;
    color:var(--ink);background:linear-gradient(180deg,#ffe58e,#ffc440);
    box-shadow:0 4px 0 #b97f18,0 8px 18px rgba(0,0,0,.35);transition:transform .05s,box-shadow .05s;touch-action:manipulation;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b97f18,0 3px 8px rgba(0,0,0,.35);}
  .btn.ghost{color:var(--cream);background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3),0 4px 0 rgba(0,0,0,.25);}
  .btn.ghost:active{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3),0 1px 0 rgba(0,0,0,.25);}
  .btns{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;}

  /* ---------- title ---------- */
  #title{align-items:center;justify-content:space-evenly;text-align:center;
    padding:calc(20px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));}
  .t-head{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;}
  .t-sub{font-size:12px;font-weight:800;letter-spacing:.3em;padding:4px 0 4px .3em;color:var(--butter);}
  .t-logo{font-size:clamp(32px,10.4vw,46px);font-weight:900;letter-spacing:.04em;line-height:1.22;padding:2px 4px;
    text-shadow:0 3px 0 rgba(0,0,0,.3);}
  .t-logo span,.t-logo em{display:block;white-space:nowrap;}
  .t-logo em{font-style:normal;color:var(--butter);}
  .t-art{width:min(74%,300px);height:clamp(130px,23dvh,220px);position:relative;}
  .t-art svg{width:100%;height:100%;display:block;}
  .howto{width:100%;max-width:330px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;display:flex;flex-direction:column;gap:9px;text-align:left;position:relative;}
  .howto .row{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.45;color:var(--cream);}
  .howto .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--butter);color:var(--ink);
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .howto b{color:var(--butter);font-weight:800;}
  .t-foot{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;position:relative;}
  .best{font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:700;padding:4px 10px;min-height:24px;}

  /* ---------- play ---------- */
  #play{background:var(--night);}
  .hud{flex:none;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;flex-direction:column;gap:9px;
    background:var(--night);border-bottom:1px solid rgba(255,255,255,.08);}
  .hud-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .cell{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;height:52px;
    padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;}
  .cell .lab{font-size:10px;font-weight:800;letter-spacing:.2em;padding-left:.2em;color:var(--sub);line-height:1;}
  .cell .val{font-size:19px;font-weight:800;line-height:1;height:20px;display:flex;align-items:center;gap:5px;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .heart{width:19px;height:18px;display:block;fill:var(--berry);transition:fill .2s,transform .2s;}
  .heart.off{fill:rgba(255,255,255,.16);transform:scale(.82);}
  .prog{display:flex;align-items:center;gap:10px;height:20px;}
  .prog .mode{flex:none;width:96px;font-size:12px;font-weight:800;color:var(--butter);line-height:1;padding:2px 0;white-space:nowrap;}
  .prog .bar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;}
  .prog .bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffc440,#ffe58e);transition:width .18s;}
  .prog .cnt{flex:none;width:96px;text-align:right;font-size:12px;font-weight:800;color:var(--cream);line-height:1;padding:2px 0;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .stage{flex:1;min-height:0;position:relative;overflow:hidden;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .banner{position:absolute;left:50%;top:9%;transform:translate(-50%,-8px) scale(.94);opacity:0;pointer-events:none;
    width:max-content;min-width:220px;max-width:calc(100% - 40px);padding:13px 24px 14px;border-radius:18px;text-align:center;
    background:rgba(9,15,42,.84);border:1.5px solid rgba(255,215,94,.55);box-shadow:0 10px 26px rgba(0,0,0,.4);
    transition:opacity .22s,transform .22s;}
  .banner.on{opacity:1;transform:translate(-50%,0) scale(1);}
  .banner .b1{font-size:21px;font-weight:900;letter-spacing:.05em;line-height:1.3;color:var(--butter);white-space:nowrap;}
  .banner .b2{font-size:13px;font-weight:700;line-height:1.4;color:var(--cream);margin-top:4px;white-space:nowrap;}
  .foot{flex:none;height:calc(56px + env(safe-area-inset-bottom));padding:6px 12px calc(6px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--wood);
    border-top:1px solid rgba(0,0,0,.25);}
  .foot .hint{flex:1;text-align:center;font-size:13px;font-weight:800;letter-spacing:.08em;color:#f6dcb6;line-height:1.3;
    padding:4px 6px;white-space:nowrap;}
  .foot .sp{flex:none;width:44px;height:44px;}
  .snd{appearance:none;border:none;flex:none;width:44px;height:44px;border-radius:12px;cursor:pointer;padding:0;
    background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
  .snd svg{width:22px;height:22px;display:block;stroke:#f6dcb6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .snd .x{display:none;} .snd.off .x{display:block;} .snd.off .w{display:none;}

  /* ---------- result ---------- */
  #result{align-items:center;justify-content:space-evenly;text-align:center;
    padding:calc(20px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));}
  .r-head{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;}
  .r-sub{font-size:12px;font-weight:800;letter-spacing:.3em;padding:4px 0 4px .3em;color:var(--butter);}
  .r-title{font-size:clamp(24px,7.4vw,32px);font-weight:900;letter-spacing:.04em;line-height:1.3;padding:2px 4px;
    text-shadow:0 3px 0 rgba(0,0,0,.3);}
  .rank{--rk:clamp(84px,14dvh,118px);width:var(--rk);height:var(--rk);border-radius:50%;flex:none;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:radial-gradient(circle at 35% 28%,#ffe9a3,#ffc440 62%,#e09a1e);color:var(--ink);
    box-shadow:0 6px 0 #a9700f,0 14px 28px rgba(0,0,0,.4),inset 0 0 0 5px rgba(255,255,255,.35);}
  .rank .rl{font-size:10px;font-weight:800;letter-spacing:.24em;padding-left:.24em;line-height:1;}
  .rank .rv{font-size:calc(var(--rk)*.49);font-weight:900;line-height:1;}
  .r-score{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;}
  .r-name{font-size:15px;font-weight:800;color:var(--butter);line-height:1.4;padding:2px 8px;}
  .r-num{font-size:44px;font-weight:900;line-height:1.1;letter-spacing:.02em;font-variant-numeric:tabular-nums;padding:0 8px;}
  .stats{width:100%;max-width:330px;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;height:64px;padding:8px 10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;}
  .stat .sl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--sub);line-height:1;white-space:nowrap;}
  .stat .sv{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;}
  #result .btns{position:relative;}
</style>
</head>
<body>
<div id="app">

  <!-- ================= TITLE ================= -->
  <section class="screen on" id="title">
    <div class="stars"></div>
    <div class="t-head">
      <div class="t-sub">MIDNIGHT PANCAKE TOWER</div>
      <div class="t-logo"><span>まよなか</span><em>パンケーキ</em></div>
    </div>
    <div class="t-art">
      <svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <circle cx="246" cy="40" r="24" fill="#ffe9a8"/><circle cx="236" cy="33" r="21" fill="#101d48"/>
        <g fill="#fff"><circle cx="40" cy="30" r="1.8"/><circle cx="74" cy="64" r="1.3"/><circle cx="210" cy="92" r="1.4"/><circle cx="270" cy="110" r="1.6"/><circle cx="24" cy="104" r="1.3"/></g>
        <g stroke="#ffffff" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M132 34c-8-8 8-12 0-22"/><path d="M168 34c-8-8 8-12 0-22"/></g>
        <ellipse cx="150" cy="186" rx="118" ry="8" fill="#000" opacity=".25"/>
        <rect x="46" y="170" width="208" height="12" rx="6" fill="#f5f7fb"/><rect x="92" y="180" width="116" height="7" rx="3.5" fill="#cfd6e6"/>
        <g>
          <rect x="62" y="144" width="176" height="26" rx="12" fill="#f3cf8e"/><rect x="62" y="144" width="176" height="15" rx="9" fill="#c9803a"/>
          <rect x="70" y="118" width="170" height="26" rx="12" fill="#f3cf8e"/><rect x="70" y="118" width="170" height="15" rx="9" fill="#c9803a"/>
          <rect x="60" y="92" width="170" height="26" rx="12" fill="#f3cf8e"/><rect x="60" y="92" width="170" height="15" rx="9" fill="#c9803a"/>
          <rect x="68" y="66" width="164" height="26" rx="12" fill="#f3cf8e"/><rect x="68" y="66" width="164" height="15" rx="9" fill="#c9803a"/>
        </g>
        <path d="M72 70c0-6 6-8 12-8h132c8 0 14 3 14 9 0 5-5 6-9 6-3 0-4 3-4 8v14c0 4-7 4-7 0V86c0-5-3-8-8-8h-40c-5 0-7 3-7 7v26c0 5-8 5-8 0V86c0-5-3-8-8-8H92c-5 0-6 3-6 6v8c0 4-7 4-7 0v-6c0-6-7-8-7-16z" fill="#a3541c" opacity=".92"/>
        <rect x="132" y="46" width="38" height="20" rx="5" fill="#ffd75e"/><rect x="132" y="46" width="38" height="8" rx="4" fill="#ffe99a"/>
      </svg>
    </div>
    <div class="howto">
      <div class="row"><span class="n">1</span><span>タップで<b>パンケーキを落とす</b></span></div>
      <div class="row"><span class="n">2</span><span>はみ出した分は切れて小さくなる</span></div>
      <div class="row"><span class="n">3</span><span><b>ぴったり</b>を続けると、ふっくら回復</span></div>
      <div class="row"><span class="n">4</span><span>空振りはライフ−1。<b>全8オーダー</b>で閉店</span></div>
    </div>
    <div class="t-foot">
      <button class="btn" id="btnStart" type="button">焼きはじめる</button>
      <div class="best" id="tBest">BEST —</div>
    </div>
  </section>

  <!-- ================= PLAY ================= -->
  <section class="screen" id="play">
    <div class="hud">
      <div class="hud-row">
        <div class="cell"><div class="lab">ORDER</div><div class="val" id="hOrder">1/8</div></div>
        <div class="cell"><div class="lab">SCORE</div><div class="val" id="hScore">0</div></div>
        <div class="cell"><div class="lab">LIFE</div><div class="val" id="hLife"></div></div>
      </div>
      <div class="prog">
        <div class="mode" id="hMode">ゆっくり</div>
        <div class="bar"><i id="hBar"></i></div>
        <div class="cnt" id="hCnt">0 / 12 まい</div>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="banner" id="banner"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>
    </div>
    <div class="foot">
      <div class="sp"></div>
      <div class="hint" id="hint">画面をタップして落とす</div>
      <button class="snd" id="btnSnd" type="button" aria-label="サウンド切り替え">
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#f6dcb6" stroke="none"/>
          <path class="w" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/>
          <path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
  </section>

  <!-- ================= RESULT ================= -->
  <section class="screen" id="result">
    <div class="stars"></div>
    <div class="r-head">
      <div class="r-sub" id="rSub">CLOSED</div>
      <div class="r-title" id="rTitle">今夜はここまで</div>
    </div>
    <div class="rank"><div class="rl">RANK</div><div class="rv" id="rRank">B</div></div>
    <div class="r-score">
      <div class="r-name" id="rName">いちにんまえ</div>
      <div class="r-num" id="rScore">0</div>
      <div class="best" id="rBest">BEST —</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="sl">完成オーダー</div><div class="sv" id="sOrder">0 / 8</div></div>
      <div class="stat"><div class="sl">焼いた枚数</div><div class="sv" id="sCount">0</div></div>
      <div class="stat"><div class="sl">PERFECT</div><div class="sv" id="sPerf">0</div></div>
      <div class="stat"><div class="sl">最大コンボ</div><div class="sv" id="sCombo">0</div></div>
    </div>
    <div class="btns">
      <button class="btn" id="btnRetry" type="button">もういちど焼く</button>
      <button class="btn ghost" id="btnHome" type="button">タイトルへ</button>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
/* ============ config ============ */
// T = seconds for one edge-to-edge pass. mode: lin / sin (slow at edges, fast in the middle) / var (speed changes every pass)
var STAGES=[
  {n:12,T:1.42,mode:'lin',base:1.0,name:'ゆっくり'},
  {n:14,T:1.22,mode:'lin',base:1.0,name:'ふつう'},
  {n:14,T:1.42,mode:'sin',base:1.0,name:'ゆらゆら'},
  {n:16,T:1.04,mode:'lin',base:1.0,name:'はやめ'},
  {n:16,T:1.00,mode:'var',base:1.0,name:'きまぐれ'},
  {n:18,T:1.10,mode:'lin',base:0.8,name:'ちいさめ'},
  {n:18,T:1.18,mode:'sin',base:1.0,name:'ゆらゆら急行'},
  {n:20,T:0.81,mode:'lin',base:1.0,name:'ラッシュ'}
];
var MAXN=20, LIVES=3;
var BASE_W=0.46;      // pancake width as a fraction of the field width
var AMP=0.36;         // slider centre swings 0.5 +- AMP
var TOL=0.028*BASE_W; // perfect tolerance
var GROW=0.05*BASE_W; // regrowth per chained perfect
var MERCY=0.30;       // after a whiff, the next pancake is at least this share of the plate size
var RANKS=[[40000,'S','まよなかの伝説'],[26000,'A','うでききシェフ'],[12000,'B','いちにんまえ'],[0,'C','みならいコック']];
var BEST_KEY='pancake-tower-best';

/* ============ dom ============ */
function $(id){return document.getElementById(id);}
var scr={title:$('title'),play:$('play'),result:$('result')};
var cv=$('cv'),ctx=cv.getContext('2d'),stageEl=$('stage'),banner=$('banner');
var W=390,Hc=640,DPR=1;
function fmt(n){return Math.round(n).toLocaleString('en-US');}
function show(name){for(var k in scr)scr[k].classList.toggle('on',k===name);G.screen=name;if(name==='play')resize();}
function loadBest(){try{return parseInt(localStorage.getItem(BEST_KEY),10)||0;}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem(BEST_KEY,String(v));}catch(e){}}

/* ============ audio (WebAudio synth, no assets) ============ */
var AC=null,muted=false;
try{muted=localStorage.getItem('pancake-tower-mute')==='1';}catch(e){}
function audioInit(){if(AC)return;try{var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}catch(e){AC=null;}}
function tone(f,d,type,vol,when,slide){
  if(!AC||muted)return;
  try{
    if(AC.state==='suspended')AC.resume();
    var t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);
  }catch(e){}
}
var SCALE=[523,587,659,784,880,1047,1175,1319];
var sfx={
  good:function(){tone(190,0.12,'sine',0.2,0,120);},
  perfect:function(c){var f=SCALE[Math.min(c-1,SCALE.length-1)];tone(170,0.1,'sine',0.16,0,120);tone(f,0.16,'triangle',0.14);tone(f*1.5,0.2,'triangle',0.08,0.06);},
  miss:function(){tone(300,0.34,'sawtooth',0.07,0,90);},
  clear:function(){[523,659,784,1047].forEach(function(f,i){tone(f,0.2,'triangle',0.12,i*0.09);});},
  win:function(){[523,659,784,1047,1319,1568].forEach(function(f,i){tone(f,0.3,'triangle',0.12,i*0.11);});},
  over:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.3,'triangle',0.1,i*0.16);});},
  ui:function(){tone(660,0.09,'triangle',0.1);}
};
function buzz(ms){try{if(!muted&&navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ============ game state ============ */
var G={screen:'title',phase:'idle',pt:0,si:0,score:0,shown:0,lives:LIVES,layers:[],combo:0,maxCombo:0,
  perfects:0,count:0,cleared:0,curW:BASE_W,sl:null,fall:null,off:0,debris:[],parts:[],pops:[],shake:0,
  mood:'idle',moodT:0,time:0,syrup:0,butter:null,side:1,won:false,sy:0,lockUntil:0};
var stars=[];for(var i=0;i<46;i++)stars.push({x:Math.random(),y:Math.random()*0.8,r:0.6+Math.random()*1.2,p:Math.random()*6.28,w:Math.random()<0.25});

function geo(){ // layout derived from the canvas size, so any phone height works
  var tableH=Math.max(70,Math.min(Hc*0.14,110));
  var tableTop=Hc-tableH, plateTop=tableTop-12;
  var top=Math.min(96,Hc*0.16);
  var H=Math.max(10,Math.min(30,(plateTop-top)/(STAGES[G.si].n+3.4)));
  return {tableTop:tableTop,plateTop:plateTop,H:H};
}
function st(){return STAGES[G.si];}
function topLayer(){return G.layers.length?G.layers[G.layers.length-1]:{x:0.5,w:BASE_W*st().base};}

function setBanner(a,b,ms){
  $('b1').textContent=a;$('b2').textContent=b;banner.classList.add('on');
  clearTimeout(setBanner.t);if(ms)setBanner.t=setTimeout(function(){banner.classList.remove('on');},ms);
}
function hideBanner(){clearTimeout(setBanner.t);banner.classList.remove('on');}

function hud(){
  var s=st();
  $('hOrder').textContent=(G.si+1)+'/'+STAGES.length;
  $('hMode').textContent=s.name;
  $('hCnt').textContent=G.layers.length+' / '+s.n+' まい';
  $('hBar').style.width=(100*G.layers.length/s.n)+'%';
  var hs=$('hLife').children;
  for(var i=0;i<hs.length;i++)hs[i].classList.toggle('off',i>=G.lives);
}
function buildHearts(){
  var h='';for(var i=0;i<LIVES;i++)h+='<svg class="heart" viewBox="0 0 24 22"><path d="M12 21C5 15 1 11.5 1 7a5.5 5.5 0 0 1 11-1.6A5.5 5.5 0 0 1 23 7c0 4.5-4 8-11 14z"/></svg>';
  $('hLife').innerHTML=h;
}

function startGame(){
  G.si=0;G.score=0;G.shown=0;G.lives=LIVES;G.combo=0;G.maxCombo=0;G.perfects=0;G.count=0;G.cleared=0;
  G.debris=[];G.parts=[];G.pops=[];G.shake=0;G.won=false;G.side=1;G.mood='idle';
  $('hScore').textContent='0';
  show('play');
  beginStage();
}
function beginStage(){
  var s=st();
  G.layers=[];G.curW=BASE_W*s.base;G.combo=0;G.sl=null;G.fall=null;G.syrup=0;G.butter=null;
  G.off=-1.3;G.phase='enter';G.pt=0;G.sy=0;
  setBanner('ORDER '+(G.si+1)+' / '+STAGES.length,s.name+'・'+s.n+'まい重ねる');
  hud();
}
function spawn(){
  G.side=-G.side;
  G.sl={p:G.side>0?0:1,dir:G.side>0?1:-1,mul:1,w:G.curW,x:0.5};
  if(st().mode==='var')G.sl.mul=0.75+Math.random()*0.7;
  sliderX();
  G.phase='slide';G.pt=0;
}
function sliderX(){
  var s=G.sl,m=st().mode,q=(m==='sin')?(1-Math.cos(Math.PI*s.p))/2:s.p;
  s.x=0.5+AMP*(2*q-1);
}
function addScore(v){G.score+=v;}
function pop(text,x,y,col,big){G.pops.push({text:text,x:x,y:y,t:0,col:col,big:!!big});}
function burst(x,y,n,cols,sp){
  for(var i=0;i<n;i++){var a=Math.random()*6.283,v=(0.4+Math.random()*0.9)*(sp||190);
    G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,t:0,life:0.5+Math.random()*0.5,r:2+Math.random()*3,col:cols[i%cols.length],star:Math.random()<0.4});}
}

function drop(){
  if(G.phase!=='slide'||!G.sl)return;
  var g=geo(),s=G.sl,top=topLayer();
  var l=s.x-s.w/2,r=s.x+s.w/2,pl=top.x-top.w/2,pr=top.x+top.w/2;
  var d=s.x-top.x,e=Math.abs(d),ov=Math.min(r,pr)-Math.max(l,pl);
  var y0=sliderY(g);
  if(e<=TOL){
    G.fall={x:top.x,w:s.w,y0:y0,t:0,kind:'perfect'};
  }else if(ov<=0.004||s.w-e<=0.006){
    // whiff: nothing lands
    G.debris.push({x:s.x*W,y:y0,w:s.w*W,vx:d>0?60:-60,vy:40,rot:0,vr:d>0?2.4:-2.4,t:0,life:1.3});
    G.sl=null;G.lives--;G.combo=0;G.shake=1;G.mood='sad';G.moodT=1.2;
    G.curW=Math.max(G.curW,MERCY*BASE_W*st().base);
    pop('MISS',Math.max(0.2,Math.min(0.8,s.x))*W,y0-6,'#ff8a98',true);
    sfx.miss();buzz(60);hud();
    if(G.lives<=0){G.phase='over';G.pt=0;setBanner('CLOSED','ライフがなくなった…');sfx.over();}
    else{G.phase='missed';G.pt=0;}
    return;
  }else{
    var nl=d>0?l:l+e, nr=d>0?r-e:r;
    G.fall={x:(nl+nr)/2,w:nr-nl,y0:y0,t:0,kind:'good',cut:{x:d>0?(nr+e/2):(nl-e/2),w:e,dir:d>0?1:-1}};
  }
  G.sl=null;G.phase='fall';G.pt=0;
}
function land(){
  var g=geo(),f=G.fall,y=g.plateTop-(G.layers.length+1)*g.H,px=f.x*W;
  var lay={x:f.x,w:f.w,dw:f.w,sq:1};
  var mult=G.si+1;
  if(f.kind==='perfect'){
    G.combo++;G.perfects++;if(G.combo>G.maxCombo)G.maxCombo=G.combo;
    if(G.combo>=2){
      var lim=BASE_W*st().base;
      lay.w=Math.min(lim,lay.w+GROW);
    }
    var pts=200+50*Math.min(G.combo-1,6);addScore(pts);
    pop(G.combo>=2?'PERFECT ×'+G.combo:'PERFECT',px,y-8,'#ffe58e',true);
    burst(px,y+g.H*0.4,10+Math.min(G.combo,6)*2,['#ffe58e','#fff','#ffc440'],170);
    G.mood='happy';G.moodT=0.9;
    sfx.perfect(G.combo);buzz(12);
  }else{
    G.combo=0;addScore(100);
    var c=f.cut;
    G.debris.push({x:c.x*W,y:y,w:c.w*W,vx:c.dir*70,vy:-40,rot:0,vr:c.dir*3.2,t:0,life:1.1});
    pop('+100',px,y-8,'#fff3dc',false);
    sfx.good();
  }
  G.layers.push(lay);G.curW=lay.w;G.count++;G.fall=null;
  hud();
  if(G.layers.length>=st().n){stageClear();}
  else{G.phase='wait';G.pt=0;}
}
function stageClear(){
  var g=geo(),s=st(),top=topLayer();
  var keep=Math.round(100*top.w/(BASE_W*s.base));
  var bonus=300*(G.si+1)+keep*5;
  addScore(bonus);G.cleared=G.si+1;
  G.phase='clear';G.pt=0;G.mood='happy';G.moodT=2;
  G.butter={t:0,x:top.x};
  setBanner('ORDER '+(G.si+1)+' かんせい!','ボーナス +'+fmt(bonus));
  sfx.clear();
}
function finish(){
  var best=loadBest(),nb=G.score>best&&G.score>0;
  if(nb)saveBest(G.score);
  var rk=RANKS[RANKS.length-1];
  for(var i=0;i<RANKS.length;i++){if(G.score>=RANKS[i][0]){rk=RANKS[i];break;}}
  $('rSub').textContent=G.won?'ALL ORDERS COMPLETE':'CLOSED';
  $('rTitle').textContent=G.won?'全オーダー完成!':'今夜はここまで';
  $('rRank').textContent=rk[1];$('rName').textContent=rk[2];
  $('rScore').textContent=fmt(G.score);
  $('rBest').textContent=nb?'NEW BEST!':'BEST '+fmt(Math.max(best,G.score));
  $('sOrder').textContent=G.cleared+' / '+STAGES.length;
  $('sCount').textContent=String(G.count);
  $('sPerf').textContent=String(G.perfects);
  $('sCombo').textContent=String(G.maxCombo);
  hideBanner();G.phase='idle';G.lockUntil=performance.now()+450;
  show('result');
}

function sliderY(g){return g.plateTop-(G.layers.length+1)*g.H-g.H*1.9;}

/* ============ update ============ */
function update(dt){
  G.time+=dt;G.pt+=dt;
  var g=geo(),i;
  if(G.moodT>0){G.moodT-=dt;if(G.moodT<=0)G.mood='idle';}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*3.2);
  // smooth slider height
  var ty=sliderY(g);G.sy=G.sy?G.sy+(ty-G.sy)*Math.min(1,dt*14):ty;

  switch(G.phase){
    case 'enter':{
      var k=Math.min(1,G.pt/0.55);G.off=-1.3*(1-k)*(1-k)*(1-k);
      if(G.pt>=1.35){hideBanner();G.off=0;spawn();}
      break;}
    case 'slide':{
      var s=G.sl,T=st().T;
      s.p+=s.dir*s.mul*dt/T;
      if(s.p>=1){s.p=2-s.p;s.dir=-1;if(st().mode==='var')s.mul=0.75+Math.random()*0.7;}
      else if(s.p<=0){s.p=-s.p;s.dir=1;if(st().mode==='var')s.mul=0.75+Math.random()*0.7;}
      sliderX();
      break;}
    case 'fall':{
      G.fall.t+=dt/0.1;
      if(G.fall.t>=1)land();
      break;}
    case 'wait': if(G.pt>=0.26)spawn();break;
    case 'missed': if(G.pt>=0.62)spawn();break;
    case 'clear':{
      if(G.butter){G.butter.t+=dt;
        if(G.butter.t>=0.42&&!G.butter.hit){G.butter.hit=true;var tp=topLayer();
          burst(tp.x*W,g.plateTop-G.layers.length*g.H,26,['#ffe58e','#fff','#ff9fb0','#6fe3c4'],240);buzz(20);}
        if(G.butter.hit)G.syrup=Math.min(1,G.syrup+dt*1.6);}
      if(G.pt>=1.75){
        if(G.si>=STAGES.length-1){
          var lb=G.lives*1000;addScore(lb);G.won=true;G.phase='win';G.pt=0;
          setBanner('全オーダー完成!','のこりライフ ボーナス +'+fmt(lb));sfx.win();
        }else{hideBanner();G.phase='serve';G.pt=0;}
      }
      break;}
    case 'serve':{
      var k2=Math.min(1,G.pt/0.5);G.off=1.4*k2*k2;
      if(G.pt>=0.5){G.si++;beginStage();}
      break;}
    case 'win':{
      if(Math.random()<dt*14)burst(Math.random()*W,Hc*0.25*Math.random(),6,['#ffe58e','#ff9fb0','#6fe3c4','#fff'],160);
      if(G.pt>=2.3)finish();
      break;}
    case 'over': if(G.pt>=1.6)finish();break;
  }
  for(i=G.layers.length-1;i>=0;i--){var L=G.layers[i];L.dw+=(L.w-L.dw)*Math.min(1,dt*10);L.sq=Math.max(0,L.sq-dt*6);}
  for(i=G.debris.length-1;i>=0;i--){var d=G.debris[i];d.t+=dt;d.vy+=1500*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;if(d.t>d.life||d.y>Hc+60)G.debris.splice(i,1);}
  for(i=G.parts.length-1;i>=0;i--){var p=G.parts[i];p.t+=dt;p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)G.parts.splice(i,1);}
  for(i=G.pops.length-1;i>=0;i--){G.pops[i].t+=dt;if(G.pops[i].t>0.85)G.pops.splice(i,1);}
  // rolling score display
  if(G.shown!==G.score){var df=G.score-G.shown;G.shown+=Math.abs(df)<3?df:df*Math.min(1,dt*12);
    if(Math.abs(G.score-G.shown)<1)G.shown=G.score;$('hScore').textContent=fmt(G.shown);}
}

/* ============ render ============ */
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
function pancake(cx,y,w,h){
  var x=cx-w/2,r=h*0.46;
  ctx.fillStyle='#f3cf8e';rr(x,y,w,h,r);ctx.fill();
  ctx.fillStyle='#c9803a';rr(x,y,w,h*0.58,r*0.9);ctx.fill();
  if(w>h*1.6){ctx.fillStyle='rgba(255,236,190,.34)';rr(x+h*0.5,y+h*0.13,w-h,h*0.12,h*0.06);ctx.fill();}
}
function star5(x,y,r){
  ctx.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();ctx.fill();
}
function drawBg(g){
  var gr=ctx.createLinearGradient(0,0,0,Hc);
  gr.addColorStop(0,'#0b1230');gr.addColorStop(0.55,'#16295a');gr.addColorStop(1,'#2a5a80');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,Hc);
  for(var i=0;i<stars.length;i++){var s=stars[i],a=0.45+0.55*Math.sin(G.time*1.6+s.p);
    ctx.globalAlpha=0.25+0.6*a;ctx.fillStyle=s.w?'#ffe9a8':'#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*g.tableTop,s.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  // moon
  var mx=W*0.84,my=Math.min(64,Hc*0.1),mr=Math.min(22,W*0.056);
  ctx.fillStyle='rgba(255,233,168,.08)';ctx.beginPath();ctx.arc(mx,my,mr*1.8,0,6.283);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(mx,my,mr,0,6.283);ctx.clip();
  ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.rect(mx-mr*2,my-mr*2,mr*4,mr*4);ctx.arc(mx-mr*0.44,my-mr*0.28,mr*0.86,0,6.283);ctx.fill('evenodd');
  ctx.restore();
  // warm glow behind the tower
  var rg=ctx.createRadialGradient(W/2,g.tableTop,10,W/2,g.tableTop,W*0.75);
  rg.addColorStop(0,'rgba(255,196,64,.22)');rg.addColorStop(1,'rgba(255,196,64,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,Hc);
}
function drawCat(g){
  var r=Math.min(30,W*0.074),cx=W*0.125,cy=g.tableTop-r*0.72;
  var bob=Math.sin(G.time*2.2)*1.2+(G.mood==='happy'?-Math.abs(Math.sin(G.time*12))*5:0);
  cy+=bob;
  var fur='#f6efe2',line='#3a2412';
  // chef hat
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(cx-r*0.38,cy-r*1.42,r*0.36,0,6.283);ctx.arc(cx,cy-r*1.56,r*0.42,0,6.283);ctx.arc(cx+r*0.38,cy-r*1.42,r*0.36,0,6.283);ctx.fill();
  rr(cx-r*0.56,cy-r*1.42,r*1.12,r*0.6,r*0.1);ctx.fill();
  // ears
  ctx.fillStyle=fur;
  ctx.beginPath();ctx.moveTo(cx-r*0.95,cy-r*0.3);ctx.lineTo(cx-r*0.86,cy-r*1.18);ctx.lineTo(cx-r*0.2,cy-r*0.8);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+r*0.95,cy-r*0.3);ctx.lineTo(cx+r*0.86,cy-r*1.18);ctx.lineTo(cx+r*0.2,cy-r*0.8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffb3be';
  ctx.beginPath();ctx.moveTo(cx-r*0.8,cy-r*0.55);ctx.lineTo(cx-r*0.76,cy-r*0.98);ctx.lineTo(cx-r*0.42,cy-r*0.76);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+r*0.8,cy-r*0.55);ctx.lineTo(cx+r*0.76,cy-r*0.98);ctx.lineTo(cx+r*0.42,cy-r*0.76);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(cx,cy,r,r*0.86,0,0,6.283);ctx.fill();
  ctx.fillStyle='#e8b98a';ctx.beginPath();ctx.ellipse(cx+r*0.5,cy-r*0.5,r*0.34,r*0.24,0.5,0,6.283);ctx.fill();
  // hat band over the forehead
  ctx.fillStyle='#e9edf5';rr(cx-r*0.58,cy-r*0.96,r*1.16,r*0.2,r*0.08);ctx.fill();
  // eyes
  var look=0,lookY=0;
  if(G.sl){look=Math.max(-1,Math.min(1,(G.sl.x-0.3)*2.4));lookY=-0.6;}
  ctx.strokeStyle=line;ctx.fillStyle=line;ctx.lineWidth=Math.max(1.6,r*0.075);ctx.lineCap='round';ctx.lineJoin='round';
  var ex=r*0.4,ey=cy-r*0.08,er=r*0.15;
  if(G.mood==='happy'){
    for(var s=-1;s<=1;s+=2){ctx.beginPath();ctx.moveTo(cx+s*ex-er,ey+er*0.5);ctx.lineTo(cx+s*ex,ey-er*0.6);ctx.lineTo(cx+s*ex+er,ey+er*0.5);ctx.stroke();}
  }else if(G.mood==='sad'){
    for(var s2=-1;s2<=1;s2+=2){ctx.beginPath();ctx.moveTo(cx+s2*ex-er,ey-er);ctx.lineTo(cx+s2*ex+er,ey+er);ctx.moveTo(cx+s2*ex+er,ey-er);ctx.lineTo(cx+s2*ex-er,ey+er);ctx.stroke();}
  }else{
    for(var s3=-1;s3<=1;s3+=2){
      ctx.fillStyle=line;ctx.beginPath();ctx.ellipse(cx+s3*ex+look*r*0.06,ey+lookY*r*0.05,er,er*1.15,0,0,6.283);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+s3*ex+look*r*0.1-er*0.25,ey+lookY*r*0.08-er*0.3,er*0.36,0,6.283);ctx.fill();
    }
  }
  // nose + mouth + whiskers
  ctx.fillStyle='#ff8fa0';ctx.beginPath();ctx.moveTo(cx-r*0.09,cy+r*0.16);ctx.lineTo(cx+r*0.09,cy+r*0.16);ctx.lineTo(cx,cy+r*0.27);ctx.closePath();ctx.fill();
  ctx.strokeStyle=line;ctx.lineWidth=Math.max(1.3,r*0.055);
  ctx.beginPath();
  if(G.mood==='sad'){ctx.arc(cx,cy+r*0.52,r*0.14,Math.PI*1.1,Math.PI*1.9);}
  else{ctx.arc(cx-r*0.13,cy+r*0.3,r*0.13,0.1,Math.PI*0.95);ctx.moveTo(cx+r*0.26,cy+r*0.31);ctx.arc(cx+r*0.13,cy+r*0.3,r*0.13,0.1,Math.PI*0.95);}
  ctx.stroke();
  ctx.strokeStyle='rgba(58,36,18,.45)';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx-r*0.6,cy+r*0.22);ctx.lineTo(cx-r*1.12,cy+r*0.14);ctx.moveTo(cx-r*0.6,cy+r*0.34);ctx.lineTo(cx-r*1.1,cy+r*0.42);
  ctx.moveTo(cx+r*0.6,cy+r*0.22);ctx.lineTo(cx+r*1.12,cy+r*0.14);ctx.moveTo(cx+r*0.6,cy+r*0.34);ctx.lineTo(cx+r*1.1,cy+r*0.42);
  ctx.stroke();
  return {cx:cx,r:r};
}
function drawTable(g,cat){
  ctx.fillStyle='#8a5632';rr(-4,g.tableTop,W+8,Hc-g.tableTop+20,10);ctx.fill();
  ctx.fillStyle='#a56a3e';rr(-4,g.tableTop,W+8,9,5);ctx.fill();
  ctx.fillStyle='#5d3720';ctx.fillRect(0,g.tableTop+(Hc-g.tableTop)*0.62,W,Hc);
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(0,g.tableTop+9,W,3);
  // paws
  ctx.fillStyle='#f6efe2';
  ctx.beginPath();ctx.ellipse(cat.cx-cat.r*0.5,g.tableTop+2,cat.r*0.3,cat.r*0.2,0,0,6.283);ctx.ellipse(cat.cx+cat.r*0.5,g.tableTop+2,cat.r*0.3,cat.r*0.2,0,0,6.283);ctx.fill();
  // mug with steam
  var mw=Math.min(34,W*0.085),mh=mw*1.02,mx=W*0.875-mw/2,my=g.tableTop-mh+3;
  ctx.strokeStyle='#fff3dc';ctx.lineWidth=mw*0.14;ctx.beginPath();ctx.arc(mx+mw,my+mh*0.48,mw*0.26,-1.3,1.3);ctx.stroke();
  ctx.fillStyle='#fff3dc';rr(mx,my,mw,mh,mw*0.2);ctx.fill();
  ctx.fillStyle='#ff6b7d';rr(mx,my+mh*0.42,mw,mh*0.2,0);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.34)';ctx.lineWidth=2.4;ctx.lineCap='round';
  for(var i=0;i<2;i++){var sx=mx+mw*(0.32+i*0.36),ph=G.time*1.6+i*1.7;ctx.beginPath();
    ctx.moveTo(sx,my-5);ctx.quadraticCurveTo(sx+Math.sin(ph)*6,my-14,sx,my-22);ctx.quadraticCurveTo(sx-Math.sin(ph)*6,my-30,sx,my-37);ctx.stroke();}
}
function drawTower(g){
  var ox=G.off*W,s=st(),i;
  var pw=BASE_W*W*1.26,px=W/2-pw/2+ox;
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(W/2+ox,g.tableTop+3,pw*0.5,5,0,0,6.283);ctx.fill();
  ctx.fillStyle='#cfd6e6';rr(W/2-pw*0.28+ox,g.plateTop+7,pw*0.56,6,3);ctx.fill();
  ctx.fillStyle='#f5f7fb';rr(px,g.plateTop,pw,9,4.5);ctx.fill();
  for(i=0;i<G.layers.length;i++){
    var L=G.layers[i],y=g.plateTop-(i+1)*g.H,sq=L.sq>0?Math.sin(L.sq*Math.PI)*0.16:0;
    var h=g.H*(1-sq),w=L.dw*W*(1+sq*0.5);
    pancake(L.x*W+ox,y+g.H-h,w,h+0.6);
  }
  // syrup + butter on a finished order
  if(G.layers.length&&(G.syrup>0||G.butter)){
    var T=G.layers[G.layers.length-1],ty=g.plateTop-G.layers.length*g.H,tw=T.dw*W,tx=T.x*W+ox;
    if(G.syrup>0){
      ctx.fillStyle='#a3541c';
      var sw=tw*(0.3+0.62*G.syrup);rr(tx-sw/2,ty-1,sw,g.H*0.36,g.H*0.18);ctx.fill();
      var drips=[-0.34,0.08,0.36];
      for(i=0;i<drips.length;i++){var dl=g.H*(0.5+i*0.45)*G.syrup,dx=tx+drips[i]*tw;
        if(Math.abs(drips[i])*tw<sw/2){rr(dx-g.H*0.11,ty+2,g.H*0.22,dl+g.H*0.2,g.H*0.11);ctx.fill();}}
    }
    if(G.butter){
      var bt=Math.min(1,G.butter.t/0.42),bw=Math.min(tw*0.6,g.H*1.5),bh=g.H*0.6;
      var by=ty-bh+2-(1-bt*bt)*g.H*7;
      ctx.fillStyle='#ffd75e';rr(tx-bw/2,by,bw,bh,bh*0.25);ctx.fill();
      ctx.fillStyle='#fff0b0';rr(tx-bw/2,by,bw,bh*0.4,bh*0.2);ctx.fill();
    }
  }
}
function render(){
  var g=geo(),i;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,Hc);
  drawBg(g);
  ctx.save();
  if(G.shake>0){var a=G.shake*G.shake*7;ctx.translate(Math.sin(G.time*70)*a,Math.cos(G.time*55)*a*0.5);}
  var cat=drawCat(g);
  drawTable(g,cat);
  drawTower(g);
  // moving pancake
  if(G.sl&&G.phase==='slide'){
    var sw=G.sl.w*W,sx=G.sl.x*W;
    ctx.fillStyle='rgba(0,0,0,.2)';rr(sx-sw/2+3,G.sy+5,sw,g.H,g.H*0.46);ctx.fill();
    pancake(sx,G.sy,sw,g.H);
  }
  if(G.fall){
    var f=G.fall,k=Math.min(1,f.t),yl=g.plateTop-(G.layers.length+1)*g.H,fy=f.y0+(yl-f.y0)*k*k;
    var fw=f.w*W,fx=f.x*W;
    if(f.cut){var l=Math.min(f.x-f.w/2,f.cut.x-f.cut.w/2),r=Math.max(f.x+f.w/2,f.cut.x+f.cut.w/2);fw=(r-l)*W;fx=(l+r)/2*W;}
    pancake(fx,fy,fw,g.H);
  }
  for(i=0;i<G.debris.length;i++){var d=G.debris[i];ctx.save();ctx.globalAlpha=Math.max(0,1-d.t/d.life);ctx.translate(d.x,d.y+g.H/2);ctx.rotate(d.rot);pancake(0,-g.H/2,d.w,g.H);ctx.restore();}
  for(i=0;i<G.parts.length;i++){var p=G.parts[i];ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.col;
    if(p.star)star5(p.x,p.y,p.r*1.5);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}}
  ctx.globalAlpha=1;
  ctx.restore();
  // popups (kept inside the field with side padding)
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  for(i=0;i<G.pops.length;i++){var o=G.pops[i],q=o.t/0.85,sz=o.big?19:15,sc=o.t<0.12?0.6+o.t/0.12*0.4:1;
    ctx.font='900 '+Math.round(sz*sc)+'px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif';
    var tw=ctx.measureText(o.text).width,x=Math.max(tw/2+14,Math.min(W-tw/2-14,o.x)),y=Math.max(sz+12,o.y-q*30);
    ctx.globalAlpha=q<0.7?1:Math.max(0,1-(q-0.7)/0.3);
    ctx.lineWidth=4;ctx.strokeStyle='rgba(9,15,42,.85)';ctx.lineJoin='round';ctx.strokeText(o.text,x,y);
    ctx.fillStyle=o.col;ctx.fillText(o.text,x,y);}
  ctx.globalAlpha=1;
}

/* ============ loop / sizing ============ */
function resize(){
  var r=stageEl.getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  DPR=Math.min(window.devicePixelRatio||1,3);
  W=r.width;Hc=r.height;
  var cw=Math.round(W*DPR),ch=Math.round(Hc*DPR);
  if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch;}
  G.sy=0;
}
var last=0;
function frame(now){
  var dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(G.screen==='play'){update(dt);render();}
  requestAnimationFrame(frame);
}
function tapNow(){ // advance to "now" so a tap is judged at the instant of the touch
  var now=performance.now(),dt=Math.min(0.05,Math.max(0,(now-last)/1000));
  if(G.screen==='play'&&G.phase==='slide'&&dt>0){last=now;update(dt);}
  drop();
}

/* ============ input ============ */
scr.play.addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('.snd'))return;
  e.preventDefault();audioInit();tapNow();
});
$('btnSnd').addEventListener('click',function(){
  muted=!muted;this.classList.toggle('off',muted);
  try{localStorage.setItem('pancake-tower-mute',muted?'1':'0');}catch(e){}
  audioInit();sfx.ui();
});
$('btnStart').addEventListener('click',function(){audioInit();sfx.ui();startGame();});
$('btnRetry').addEventListener('click',function(){if(performance.now()<G.lockUntil)return;audioInit();sfx.ui();startGame();});
$('btnHome').addEventListener('click',function(){if(performance.now()<G.lockUntil)return;sfx.ui();refreshTitle();show('title');});
document.addEventListener('keydown',function(e){
  if(e.code!=='Space'&&e.code!=='Enter')return;
  if(e.repeat){e.preventDefault();return;}
  if(G.screen==='play'){e.preventDefault();audioInit();tapNow();}
});
// no zoom / no scroll / no selection
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});
document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
var lastTouch=0;
document.addEventListener('touchend',function(e){var n=Date.now();if(n-lastTouch<320&&e.cancelable&&!(e.target.closest&&e.target.closest('button')))e.preventDefault();lastTouch=n;},{passive:false});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(stageEl);
document.addEventListener('visibilitychange',function(){last=performance.now();});

function refreshTitle(){var b=loadBest();$('tBest').textContent=b>0?'BEST '+fmt(b):'BEST —';}

/* read-only snapshot used by automated playtests */
window.__pt={snap:function(){var t=topLayer();return {screen:G.screen,phase:G.phase,stage:G.si,layers:G.layers.length,need:st().n,
  lives:G.lives,score:G.score,combo:G.combo,sx:G.sl?G.sl.x:null,sdir:G.sl?G.sl.dir:0,sw:G.sl?G.sl.w:null,tx:t.x,tw:t.w,W:W,Hc:Hc,H:geo().H};}};

buildHearts();$('btnSnd').classList.toggle('off',muted);refreshTitle();
requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame);});
})();
</script>
