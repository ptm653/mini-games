<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>陽だまり温室</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:#e9f1dc;color:#33402b;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;line-height:1.3}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:absolute;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));background:#f6f9ee}
.top{display:flex;align-items:center;justify-content:space-between;height:30px;flex:none}
.top h1{font-size:17px;letter-spacing:.04em;color:#3f6b33;padding:2px 4px;white-space:nowrap}
.day{font-size:13px;font-weight:700;background:#3f6b33;color:#fff;border-radius:99px;padding:5px 14px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.stat{background:#fff;border:1px solid #d5e0c4;border-radius:10px;padding:6px 8px;height:50px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0}
.stat b{font-size:11px;font-weight:400;color:#78866c;white-space:nowrap}
.stat span{font-size:17px;font-weight:700;white-space:nowrap}
.stat.low span{color:#c8452f}
.goal{flex:none;display:flex;align-items:center;gap:8px;height:20px;padding:0 4px}
.goal b{font-size:11px;font-weight:400;color:#78866c;white-space:nowrap}
.gbar{flex:1;height:8px;background:#dfe7d0;border-radius:99px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:#e8a73a;border-radius:99px;transition:width .3s}
.wx{flex:none;height:72px;display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;border:1px solid #d5e0c4;background:#fff}
.wx.w0{background:#fff5d6;border-color:#f0d88c}.wx.w1{background:#eef0ee;border-color:#d3d8d3}.wx.w2{background:#e2eefa;border-color:#b9d2ec}
.wx .big{font-size:36px;width:44px;text-align:center;flex:none;line-height:1}
.wx .tx{flex:1;min-width:0}
.wx .tx b{display:block;font-size:15px;white-space:nowrap}
.wx .tx span{display:block;font-size:12px;color:#5b6852;white-space:nowrap}
.wx .nx{flex:none;width:58px;height:54px;border-radius:10px;background:rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.wx .nx b{font-size:11px;font-weight:400;color:#78866c}
.wx .nx span{font-size:22px;line-height:1.2}
.plots{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
.plot{position:relative;min-height:0;min-width:0;border-radius:14px;background:#efe3cf;border:2px solid #d9c6a5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 10px;overflow:hidden}
.plot:active{transform:scale(.97)}
.plot .ic{font-size:clamp(26px,6.5vh,46px);line-height:1.1;height:1.15em}
.plot .br{width:70%;height:8px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden;flex:none}
.plot .br i{display:block;height:100%;width:0;background:#6aa84f;border-radius:99px;transition:width .3s}
.plot .lb{font-size:12px;font-weight:700;height:18px;line-height:18px;padding:0 6px;white-space:nowrap}
.plot .bd{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;height:20px;line-height:20px;padding:0 8px;border-radius:99px;white-space:nowrap;display:none}
.plot.empty{background:#f4efe4;border-style:dashed}
.plot.empty .ic{color:#b9a47f;font-weight:700}.plot.empty .br{visibility:hidden}.plot.empty .lb{color:#8d7a58}
.plot.grow{background:#e4efd3;border-color:#b5cf98}
.plot.need{border-color:#3d8fd6}
.plot.need .bd{display:block;background:#3d8fd6;color:#fff}
.plot.wet .bd{display:block;background:#d5e9fb;color:#2c6aa3}
.plot.ready{background:#ffe9b8;border-color:#e8a73a}
.plot.ready .br i{background:#e8a73a}.plot.ready .lb{color:#a2600f}
.plot.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.05)}}
.msg{flex:none;height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:4px 10px;border-radius:10px;background:#fff;border:1px solid #d5e0c4;overflow:hidden}
.msg.warn{background:#fdeae5;border-color:#eeb3a6;color:#b23a25;font-weight:700}
.acts{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:58px;min-width:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn b{font-size:15px;white-space:nowrap}.btn span{font-size:11px;font-weight:400;white-space:nowrap;opacity:.9}
.btn.buy{background:#d5e9fb;color:#235d94}.btn.next{background:#4f8a3f;color:#fff}
.btn.off{opacity:.45}
.ov{position:absolute;top:0;bottom:0;left:0;right:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(233,241,220,.94)}
.ov.on{display:flex}
.card{width:100%;max-width:340px;background:#fff;border-radius:18px;border:1px solid #d5e0c4;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 20px rgba(60,90,40,.15)}
.card .em{font-size:48px;line-height:1.1}
.card h2{font-size:22px;color:#3f6b33;padding:2px 6px}
.card p{font-size:13px;padding:0 6px;color:#5b6852}
.card ul{list-style:none;text-align:left;background:#f6f9ee;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.card li{font-size:13px;display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.card li b{white-space:nowrap}
.card .go{height:54px;width:100%;border-radius:14px;background:#4f8a3f;color:#fff;font-size:16px;font-weight:700;padding:0 16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.card.lose h2{color:#b23a25}
</style>
</head>
<body>
<div id="app">
  <div class="top"><h1>🌿 陽だまり温室</h1><div class="day" id="day">1日目 / 15</div></div>
  <div class="stats">
    <div class="stat" id="stM"><b>資金</b><span id="money">¥0</span></div>
    <div class="stat" id="stW"><b>水タンク</b><span id="water">0</span></div>
    <div class="stat"><b>評判</b><span id="rep">★0</span></div>
  </div>
  <div class="goal"><b id="goalT">目標 ¥1500</b><div class="gbar"><i id="gbar"></i></div></div>
  <div class="wx" id="wx">
    <div class="big" id="wxI"></div>
    <div class="tx"><b id="wxN"></b><span id="wxA"></span><span id="wxB"></span></div>
    <div class="nx"><b>明日</b><span id="wxT"></span></div>
  </div>
  <div class="plots" id="plots"></div>
  <div class="msg" id="msg"></div>
  <div class="acts">
    <button class="btn buy" id="buy"><b>水を買う</b><span id="buyT"></span></button>
    <button class="btn next" id="next"><b id="nextT">次の日へ</b><span id="nextS"></span></button>
  </div>
  <div class="ov on" id="ovTitle">
    <div class="card">
      <div class="em">🌷</div>
      <h2>陽だまり温室</h2>
      <p>15日間で資金 ¥1500 を目指そう</p>
      <ul>
        <li><span>🌱 空き区画をタップ</span><b>苗を植える</b></li>
        <li><span>☀️ 晴れの日はタップ</span><b>水やり</b></li>
        <li><span>🌷 育ったらタップ</span><b>出荷</b></li>
        <li><span>⭐ 続けて出荷すると</span><b>高く売れる</b></li>
        <li><span>💸 維持費は毎日 ¥5</span><b>赤字で倒産</b></li>
      </ul>
      <button class="go" id="start">はじめる</button>
    </div>
  </div>
  <div class="ov" id="ovRes">
    <div class="card" id="resCard">
      <div class="em" id="resE"></div>
      <h2 id="resH"></h2>
      <p id="resP"></p>
      <ul>
        <li><span>最終資金</span><b id="resM"></b></li>
        <li><span>出荷した数</span><b id="resS"></b></li>
        <li><span>最高評判</span><b id="resR"></b></li>
      </ul>
      <button class="go" id="retry">もう一度あそぶ</button>
    </div>
  </div>
</div>
<script>
var CFG={days:15,plots:4,seed:30,mature:4,start:100,upkeep:5,goal:1500,shipBase:110,repMul:4,repMax:20,repDecay:1,
  waterCost:10,buyPrice:20,buyAmt:30,rainWater:25,tank0:30,tankMax:120,sunGrow:3,wither:0,pSun:.3,pCloud:.35,p2:.75};
var WX=[{i:'☀️',n:'晴れ',a:'水やりで成長 +3',b:'水なしだと 育たない'},
        {i:'☁️',n:'くもり',a:'水やり不要',b:'成長 +1〜2'},
        {i:'🌧️',n:'雨',a:'水やり不要・成長 +1〜2',b:'タンクに水 +25'}];
var S={screen:'title'};

/* ---------- game logic ---------- */
function newGame(){
  S={screen:'play',day:1,money:CFG.start,water:CFG.tank0,rep:0,maxRep:0,shipped:0,shippedToday:0,
     weather:[],plots:[],msg:'空き区画をタップして苗を植えよう',warn:false,confirm:false,result:null};
  for(var d=0;d<CFG.days;d++){var r=Math.random();S.weather.push(r<CFG.pSun?0:r<CFG.pSun+CFG.pCloud?1:2);}
  for(var i=0;i<CFG.plots;i++)S.plots.push({on:false,g:0,wet:false});
}
function todayWx(){return S.weather[S.day-1];}
function shipPrice(){return CFG.shipBase+S.rep*CFG.repMul;}
function say(t,warn){S.msg=t;S.warn=!!warn;}
function plant(i){
  var p=S.plots[i];
  if(p.on)return false;
  if(S.money<CFG.seed){say('資金が足りません（苗 ¥'+CFG.seed+'）',1);return false;}
  S.money-=CFG.seed;p.on=true;p.g=0;p.wet=false;
  if(S.money<CFG.upkeep*3)say('苗を植えた。残り資金に注意（維持費 毎日¥'+CFG.upkeep+'）',1);
  else say('苗を植えた（−¥'+CFG.seed+'）');
  return true;
}
function waterPlot(i){
  var p=S.plots[i];
  if(!p.on||p.g>=CFG.mature)return false;
  if(todayWx()!==0){say('今日は水やり不要です');return false;}
  if(p.wet){say('この区画は水やり済みです');return false;}
  if(S.water<CFG.waterCost){say('水が足りません。水を買おう',1);return false;}
  S.water-=CFG.waterCost;p.wet=true;
  say('水をあげた（水 −'+CFG.waterCost+'）');return true;
}
function ship(i){
  var p=S.plots[i];
  if(!p.on||p.g<CFG.mature)return false;
  var v=shipPrice();
  S.money+=v;S.shipped++;S.shippedToday++;
  if(S.rep<CFG.repMax)S.rep++;
  if(S.rep>S.maxRep)S.maxRep=S.rep;
  p.on=false;p.g=0;p.wet=false;
  say('出荷！ +¥'+v+'　評判 ★'+S.rep);return true;
}
function buyWater(){
  if(S.money<CFG.buyPrice){say('資金が足りません（水 ¥'+CFG.buyPrice+'）',1);return false;}
  if(S.water>=CFG.tankMax){say('タンクが満タンです');return false;}
  S.money-=CFG.buyPrice;S.water=Math.min(CFG.tankMax,S.water+CFG.buyAmt);
  say('水を買った（−¥'+CFG.buyPrice+' / 水 +'+CFG.buyAmt+'）');return true;
}
function endDay(){
  var w=todayWx(),dry=0,i,p;
  for(i=0;i<S.plots.length;i++){
    p=S.plots[i];
    if(p.on&&p.g<CFG.mature){
      if(w===0){if(p.wet)p.g+=CFG.sunGrow;else{p.g=Math.max(0,p.g-CFG.wither);dry++;}}
      else p.g+=1+(Math.random()<CFG.p2?1:0);
      if(p.g>CFG.mature)p.g=CFG.mature;
    }
    p.wet=false;
  }
  if(w===2)S.water=Math.min(CFG.tankMax,S.water+CFG.rainWater);
  if(S.shippedToday===0)S.rep=Math.max(0,S.rep-CFG.repDecay);
  S.shippedToday=0;
  S.money-=CFG.upkeep;
  if(S.money<0){finish('bankrupt');return;}
  if(S.day>=CFG.days){finish(S.money>=CFG.goal?'win':'short');return;}
  S.day++;
  var t=S.day+'日目。維持費 −¥'+CFG.upkeep;
  if(dry)t+='　水なしで'+dry+'株 育たず…';
  else if(w===2)t+='　雨で水 +'+CFG.rainWater;
  if(S.day===CFG.days)t='最終日！育った株を出荷しよう';
  say(t,dry>0);
}
function finish(r){S.result=r;S.screen='result';}

/* ---------- tap handlers ---------- */
function tapStart(){newGame();render();}
function tapRetry(){newGame();render();}
function tapPlot(i){
  if(S.screen!=='play')return;
  S.confirm=false;
  var p=S.plots[i],ok;
  if(!p.on)ok=plant(i);else if(p.g>=CFG.mature)ok=ship(i);else ok=waterPlot(i);
  render();if(ok)pop(i);
}
function tapBuy(){if(S.screen!=='play')return;S.confirm=false;buyWater();render();}
function tapNext(){
  if(S.screen!=='play')return;
  if(S.money<CFG.upkeep&&!S.confirm){
    S.confirm=true;say('このままだと倒産！ もう一度タップで進む',1);render();return;
  }
  S.confirm=false;endDay();render();
}

/* ---------- view ---------- */
function $(id){return document.getElementById(id);}
function pop(i){var e=$('p'+i);e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');}
function build(){
  var h='';
  for(var i=0;i<CFG.plots;i++)h+='<button class="plot" id="p'+i+'"><span class="bd" id="bd'+i+'"></span><span class="ic" id="ic'+i+'"></span><span class="br"><i id="br'+i+'"></i></span><span class="lb" id="lb'+i+'"></span></button>';
  $('plots').innerHTML=h;
  for(i=0;i<CFG.plots;i++)$('p'+i).addEventListener('click',tapPlot.bind(null,i));
  $('buy').addEventListener('click',tapBuy);
  $('next').addEventListener('click',tapNext);
  $('start').addEventListener('click',tapStart);
  $('retry').addEventListener('click',tapRetry);
  $('goalT').textContent='目標 ¥'+CFG.goal;
  $('buyT').textContent='¥'+CFG.buyPrice+' ／ 水 +'+CFG.buyAmt;
}
function render(){
  $('ovTitle').className='ov'+(S.screen==='title'?' on':'');
  $('ovRes').className='ov'+(S.screen==='result'?' on':'');
  if(S.screen==='title')return;
  var w=todayWx(),x=WX[w],last=S.day>=CFG.days;
  $('day').textContent=S.day+'日目 / '+CFG.days;
  $('money').textContent='¥'+S.money;
  $('water').textContent='💧'+S.water;
  $('rep').textContent='★'+S.rep;
  $('stM').className='stat'+(S.money<CFG.upkeep?' low':'');
  $('stW').className='stat'+(S.water<CFG.waterCost?' low':'');
  $('gbar').style.width=Math.max(0,Math.min(100,S.money/CFG.goal*100))+'%';
  $('wx').className='wx w'+w;
  $('wxI').textContent=x.i;$('wxN').textContent='今日は '+x.n;$('wxA').textContent=x.a;$('wxB').textContent=x.b;
  $('wxT').textContent=last?'—':WX[S.weather[S.day]].i;
  for(var i=0;i<S.plots.length;i++){
    var p=S.plots[i],c='plot',ic,lb,bd='',pc=0;
    if(!p.on){c+=' empty';ic='＋';lb='苗を植える ¥'+CFG.seed;}
    else if(p.g>=CFG.mature){c+=' ready';ic='🌷';lb='出荷する ¥'+shipPrice();pc=100;}
    else{
      c+=' grow';ic=p.g*2>=CFG.mature?'🌿':'🌱';lb='成長 '+p.g+' / '+CFG.mature;pc=p.g/CFG.mature*100;
      if(p.wet){c+=' wet';bd='水やり済';}else if(w===0){c+=' need';bd='💧水やり';}
    }
    $('p'+i).className=c;$('ic'+i).textContent=ic;$('lb'+i).textContent=lb;$('bd'+i).textContent=bd;$('br'+i).style.width=pc+'%';
  }
  $('msg').textContent=S.msg;$('msg').className='msg'+(S.warn?' warn':'');
  $('buy').className='btn buy'+(S.money<CFG.buyPrice?' off':'');
  $('nextT').textContent=last?'結果を見る':'次の日へ';
  $('nextS').textContent='維持費 −¥'+CFG.upkeep;
  if(S.screen==='result'){
    var r=S.result,win=r==='win';
    $('resCard').className='card'+(win?'':' lose');
    $('resE').textContent=win?'🏆':r==='bankrupt'?'💸':'🥀';
    $('resH').textContent=win?'目標達成！':r==='bankrupt'?'倒産…':'目標に届かず';
    $('resP').textContent=win?(S.money>=CFG.goal+1000?'温室の名人です！':'温室は大繁盛です')
      :r==='bankrupt'?S.day+'日目に維持費が払えなくなった':'目標 ¥'+CFG.goal+' まで あと ¥'+(CFG.goal-S.money);
    $('resM').textContent='¥'+S.money;$('resS').textContent=S.shipped+' 株';$('resR').textContent='★'+S.maxRep;
  }
}
build();render();
</script>
</body>
</html>
