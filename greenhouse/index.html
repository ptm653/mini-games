<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>陽だまり温室</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;background:#e9dcc3;color:#3d3426;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:linear-gradient(#fdf3d7,#f3e6c4 55%,#e4d3a8)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:12px 14px 14px;gap:10px}
.scr.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
/* ボタン共通:文字量にかかわらず固定サイズ */
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;flex:none;padding:6px 12px;border-radius:14px;font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;background:#fffaf0;color:#5b4a2c;box-shadow:0 3px 0 #c9b582;border:2px solid #c9b582}
.btn.pri{background:#4f9a55;color:#fff;border-color:#35763c;box-shadow:0 3px 0 #2b6332}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9b582}
.btn.off{opacity:.45}
/* タイトル・結果 */
.center{justify-content:center;align-items:center;text-align:center;gap:16px;padding:20px 22px}
.logo{width:150px;height:118px;flex:none}
h1{font-size:32px;line-height:1.3;padding:2px 10px;color:#3f7a45;letter-spacing:.04em}
.sub{font-size:14px;line-height:1.5;padding:2px 10px;color:#7a6845}
.card{width:100%;background:#fffaf0;border:2px solid #dccb9d;border-radius:16px;padding:12px 16px}
.how li{list-style:none;font-size:13px;line-height:1.5;padding:4px 4px 4px 22px;text-align:left;position:relative}
.how li:before{content:"";position:absolute;left:5px;top:10px;width:9px;height:9px;border-radius:50% 0 50% 50%;background:#6bb36f}
.row{display:flex;justify-content:space-between;align-items:center;font-size:15px;line-height:1.4;padding:7px 6px;border-bottom:1px dashed #e0d2aa}
.row:last-child{border-bottom:0}
.row b{font-size:15px}
#rTitle{font-size:30px}
#rTitle.ng{color:#b0563c}
/* プレイ画面 */
.top{display:flex;gap:8px;flex:none}
.chip{background:#fffaf0;border:2px solid #dccb9d;border-radius:14px;padding:7px 10px;display:flex;align-items:center;gap:8px;height:64px}
#dayBox{flex:none;width:96px;flex-direction:column;justify-content:center;gap:2px}
#dayBox b{font-size:18px;line-height:1.2}
.cap{font-size:11px;line-height:1.3;color:#8a7850}
#wBox{flex:1;min-width:0}
#wIcon{width:38px;height:38px;flex:none}
.wt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#wName{font-size:16px;font-weight:700;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.stat{background:#fffaf0;border:2px solid #dccb9d;border-radius:14px;padding:6px 8px;text-align:center;height:54px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.stat b{font-size:18px;line-height:1.2}
.goal{flex:none;display:flex;align-items:center;gap:8px;padding:2px 4px}
.goal .cap{flex:none;font-size:12px}
.bar{flex:1;height:10px;border-radius:5px;background:#e3d5ad;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#e2a33a;border-radius:5px;transition:width .3s}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.plot{min-height:0;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:8px 10px 10px;border-radius:16px;background:#fffaf0;border:2px solid #dccb9d;box-shadow:0 3px 0 #d3c08f}
.plot:active{transform:translateY(2px);box-shadow:0 1px 0 #d3c08f}
.plot.ripe{border-color:#e2a33a;background:#fff4d6}
.plot.wet{border-color:#7fb7d6;background:#f2f9fc}
.ph{display:flex;justify-content:space-between;align-items:center;flex:none;padding:0 2px}
.ph span{font-size:12px;line-height:1.4;font-weight:700;color:#8a7850}
.ph em{font-style:normal;font-size:12px;line-height:1.4;font-weight:700;padding:3px 8px;border-radius:10px;background:#efe3c2;color:#6d5c38}
.ripe .ph em{background:#e2a33a;color:#fff}
.wet .ph em{background:#7fb7d6;color:#fff}
.plot svg{flex:1;min-height:0;width:100%}
.pg{flex:none;display:flex;align-items:center;gap:6px;padding:0 2px}
.pg .cap{flex:none;width:52px;text-align:left}
.pg .bar{height:8px}
.pg .bar i{background:#6bb36f}
.act{flex:none;height:30px;display:flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:10px;font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;background:#e7f1dc;color:#3f7a45}
.ripe .act{background:#e2a33a;color:#fff}
.wet .act{background:#dcebf3;color:#4b7f9c}
#msg{flex:none;height:40px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 12px;border-radius:12px;background:rgba(255,250,240,.75);font-size:13px;line-height:1.35}
.btns{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-height:700px){
.scr{gap:7px;padding:8px 12px 10px}
.center{gap:10px;padding:12px 18px}
.logo{width:112px;height:88px}
h1{font-size:28px}
.chip{height:60px}.stat{height:48px}.btn{height:48px}
#msg{height:36px}.grid{gap:8px}
.plot{padding:6px 8px 8px;gap:3px}.act{height:26px}
.how li{padding-top:2px;padding-bottom:2px}.row{padding:5px 6px}
}
</style>
</head>
<body>
<div id="app">
<section id="title" class="scr center on">
<svg class="logo" viewBox="0 0 150 118"><circle cx="118" cy="26" r="16" fill="#f2b84b"/><path d="M20 112V58L75 22l55 36v54z" fill="#d9eef0" stroke="#5b8f63" stroke-width="5" stroke-linejoin="round"/><path d="M75 22v90M20 58h110M47 40v72M103 40v72" stroke="#5b8f63" stroke-width="3" fill="none"/><path d="M75 108V78" stroke="#3f7a45" stroke-width="5" stroke-linecap="round"/><path d="M75 90c-16 0-20-10-20-16 12 0 20 6 20 16zM75 84c14 0 18-9 18-15-11 0-18 6-18 15z" fill="#6bb36f"/><circle cx="75" cy="72" r="7" fill="#e0603f"/></svg>
<h1>陽だまり温室</h1>
<p class="sub">15日間で ¥<span id="tGoal"></span> を目指す小さな温室経営</p>
<ul class="card how">
<li>空き区画をタップして苗を植える(¥<span id="tSeed"></span>)</li>
<li>晴れの日は水やり必須。忘れるとしおれて育たない</li>
<li>実ったらタップで出荷。続けて出荷すると評判アップ</li>
<li>維持費は毎日 ¥<span id="tUp"></span>。所持金が尽きると倒産</li>
</ul>
<button class="btn pri" id="bStart">温室をひらく</button>
</section>

<section id="play" class="scr">
<div class="top">
<div class="chip" id="dayBox"><span class="cap">経営</span><b id="day"></b></div>
<div class="chip" id="wBox"><svg id="wIcon" viewBox="0 0 40 40"></svg><div class="wt"><span id="wName"></span><span class="cap" id="wNote"></span><span class="cap" id="wNext"></span></div></div>
</div>
<div class="stats">
<div class="stat"><span class="cap">所持金</span><b id="money"></b></div>
<div class="stat"><span class="cap">水</span><b id="water"></b></div>
<div class="stat"><span class="cap">評判</span><b id="rep"></b></div>
</div>
<div class="goal"><span class="cap" id="goalCap"></span><div class="bar"><i id="goalBar"></i></div></div>
<div class="grid" id="grid"></div>
<div id="msg"></div>
<div class="btns">
<button class="btn" id="bBuy"></button>
<button class="btn pri" id="bNext"></button>
</div>
</section>

<section id="result" class="scr center">
<svg class="logo" id="rIcon" viewBox="0 0 150 118"></svg>
<h1 id="rTitle"></h1>
<p class="sub" id="rSub"></p>
<div class="card">
<div class="row"><span>最終所持金</span><b id="rMoney"></b></div>
<div class="row"><span>目標</span><b id="rGoal"></b></div>
<div class="row"><span>出荷した数</span><b id="rShip"></b></div>
<div class="row"><span>最高の評判</span><b id="rRep"></b></div>
<div class="row"><span>経営した日数</span><b id="rDay"></b></div>
</div>
<button class="btn pri" id="bRetry">もう一度あそぶ</button>
</section>
</div>
<script>
(function(){
"use strict";
/* ---- 調整済み定数 ---- */
var C={DAYS:15,GOAL:1500,START:150,WATER0:40,PLOTS:4,SEED:30,SHIP:110,REP:4,REPMAX:10,UPKEEP:5,
NEED:4,SUN:3,WCOST:10,BUYCOST:20,BUYGAIN:30,RAIN:25,EVAP:5,WMAX:99,PSUN:.33,PCLOUD:.35};
var WN=["晴れ","くもり","雨"];
var WNOTE=["成長+3・水やり必須","成長+1〜2・水やりで+2","成長+1〜2・水+"+C.RAIN];
var S;
function roll(){var r=Math.random();return r<C.PSUN?0:r<C.PSUN+C.PCLOUD?1:2}
function shipPrice(){return C.SHIP+S.rep*C.REP}
function newGame(){
S={day:1,money:C.START,water:C.WATER0,rep:0,best:0,shipped:0,w:roll(),next:roll(),plots:[],over:false,win:false,bust:false,
msg:"空き区画をタップして苗を植えよう"};
for(var i=0;i<C.PLOTS;i++)S.plots.push({s:0,g:0,wet:false,dry:false});
show("play");render();
}
/* 区画タップ:植える / 水やり / 出荷 */
function tapPlot(i){
if(!S||S.over)return;
var p=S.plots[i];
if(p.s===0){
if(S.money<C.SEED){S.msg="お金が足りない(苗は ¥"+C.SEED+")";}
else{S.money-=C.SEED;p.s=1;p.g=0;p.wet=false;p.dry=false;S.msg="苗を植えた(-¥"+C.SEED+")";}
}else if(p.s===2){
var v=shipPrice();S.money+=v;S.shipped++;
if(S.rep<C.REPMAX)S.rep++;
if(S.rep>S.best)S.best=S.rep;
p.s=0;p.g=0;p.wet=false;p.dry=false;
S.msg="出荷した(+¥"+v+")評判が上がった";
}else if(S.w===2){S.msg="雨の日は水やりいらず";}
else if(p.wet){S.msg="今日はもう水をやった";}
else if(S.water<C.WCOST){S.msg="水が足りない(水を買おう)";}
else{S.water-=C.WCOST;p.wet=true;p.dry=false;S.msg="水をやった(水-"+C.WCOST+")";}
render();
}
function buyWater(){
if(!S||S.over)return;
if(S.money<C.BUYCOST)S.msg="お金が足りない(水は ¥"+C.BUYCOST+")";
else if(S.water>=C.WMAX)S.msg="タンクがいっぱい";
else{S.money-=C.BUYCOST;S.water=Math.min(C.WMAX,S.water+C.BUYGAIN);S.msg="水を買った(-¥"+C.BUYCOST+" / 水+"+C.BUYGAIN+")";}
render();
}
/* 1日の終わり:成長 → 水の増減 → 維持費 → 勝敗判定 */
function nextDay(){
if(!S||S.over)return;
var grew=0,dry=0,ripe=0,i,p,d;
for(i=0;i<S.plots.length;i++){
p=S.plots[i];if(p.s!==1)continue;
d=0;p.dry=false;
if(S.w===0){if(p.wet)d=C.SUN;else{p.dry=true;dry++;}}
else if(S.w===1)d=p.wet?2:1+Math.floor(Math.random()*2);
else d=1+Math.floor(Math.random()*2);
if(d>0){grew++;p.g+=d;}
if(p.g>=C.NEED){p.g=C.NEED;p.s=2;ripe++;}
p.wet=false;
}
if(dry>0&&S.rep>0)S.rep--;
if(S.w===2)S.water=Math.min(C.WMAX,S.water+C.RAIN);
if(S.w===0)S.water=Math.max(0,S.water-C.EVAP);
S.money-=C.UPKEEP;
if(S.money<0){S.over=true;S.bust=true;S.win=false;}
else if(S.day>=C.DAYS){S.over=true;S.win=S.money>=C.GOAL;}
if(S.over){finish();return;}
S.msg=WN[S.w]+"の一日。"+(dry?dry+"株がしおれた…":ripe?ripe+"株が実った":grew?grew+"株が育った":"維持費 -¥"+C.UPKEEP);
S.day++;S.w=S.next;S.next=roll();
render();
}
/* ---- 描画 ---- */
function $(id){return document.getElementById(id)}
function show(id){["title","play","result"].forEach(function(k){$(k).className="scr"+(k==="play"?"":" center")+(k===id?" on":"")})}
var SOIL='<ellipse cx="50" cy="66" rx="36" ry="9" fill="#b98a5a"/><ellipse cx="50" cy="64" rx="30" ry="6" fill="#8f6640"/>';
function plantSvg(p){
var h='<svg viewBox="0 0 100 78" preserveAspectRatio="xMidYMid meet">'+SOIL;
if(p.s===0)return h+'<path d="M50 30v20M40 40h20" stroke="#c9b582" stroke-width="5" stroke-linecap="round"/></svg>';
var r=p.s===2?1:p.g/C.NEED,t=62-14-r*34,c=p.dry?"#b3a05a":"#6bb36f",st=p.dry?"#8d7b3f":"#3f7a45",l=7+r*11;
h+='<path d="M50 63V'+t+'" stroke="'+st+'" stroke-width="4" stroke-linecap="round"/>';
function leaf(y,dir,sz){var x=50+dir*sz*1.7,yy=y-(p.dry?-sz*.5:sz*.7);return '<path d="M50 '+y+'Q'+(50+dir*sz)+' '+(y-sz*(p.dry?.2:1.1))+' '+x+' '+yy+'Q'+(50+dir*sz*.8)+' '+(y+sz*.4)+' 50 '+y+'z" fill="'+c+'"/>'}
h+=leaf(t+4,-1,l)+leaf(t+4,1,l);
if(r>.45)h+=leaf(t+17,1,l*.8)+leaf(t+17,-1,l*.8);
if(p.s===2)h+='<circle cx="38" cy="'+(t+13)+'" r="7" fill="#e0603f"/><circle cx="62" cy="'+(t+11)+'" r="7" fill="#e0603f"/><circle cx="50" cy="'+(t-1)+'" r="7.5" fill="#ea7a4a"/>';
if(p.wet)h+='<path d="M16 22q-5 8 0 11q5-3 0-11zM84 30q-5 8 0 11q5-3 0-11z" fill="#6fb1d8"/>';
return h+'</svg>';
}
var CLOUD='<path d="M11 28a6.5 6.5 0 0 1 1-13 9 9 0 0 1 17 1 6 6 0 0 1 0 12z" fill="#b9c3c9"/>';
var WICON=['<circle cx="20" cy="20" r="8" fill="#f2b84b"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6M8 8l4 4M28 28l4 4M32 8l-4 4M12 28l-4 4" stroke="#f2b84b" stroke-width="3" stroke-linecap="round"/>',
CLOUD,CLOUD.replace("#b9c3c9","#8fa3b0")+'<path d="M14 32l-2 5M21 32l-2 5M28 32l-2 5" stroke="#5a9ed0" stroke-width="2.5" stroke-linecap="round"/>'];
function render(){
$("day").textContent=S.day+" / "+C.DAYS+"日";
$("wIcon").innerHTML=WICON[S.w];
$("wName").textContent="今日は"+WN[S.w];
$("wNote").textContent=WNOTE[S.w];
$("wNext").textContent=S.day<C.DAYS?"明日の予報:"+WN[S.next]:"今日が最終日";
$("money").textContent="¥"+S.money;
$("water").textContent=S.water;
$("rep").textContent="★"+S.rep;
$("goalCap").textContent="目標 ¥"+C.GOAL;
$("goalBar").style.width=Math.max(0,Math.min(100,S.money/C.GOAL*100))+"%";
var h="",i,p,tag,act,cls;
for(i=0;i<S.plots.length;i++){
p=S.plots[i];cls="plot";
if(p.s===0){tag="空き";act="苗を植える ¥"+C.SEED;}
else if(p.s===2){tag="実った";act="出荷する ¥"+shipPrice();cls+=" ripe";}
else if(p.wet){tag="水やり済";act="水やり済み";cls+=" wet";}
else if(S.w===2){tag=p.dry?"しおれ":"育成中";act="雨で水いらず";}
else{tag=p.dry?"しおれ":"育成中";act="水をやる 水-"+C.WCOST;}
h+='<button class="'+cls+'" data-i="'+i+'"><div class="ph"><span>区画'+(i+1)+'</span><em>'+tag+'</em></div>'+plantSvg(p)+
'<div class="pg"><span class="cap">成長 '+p.g+'/'+C.NEED+'</span><div class="bar"><i style="width:'+(p.g/C.NEED*100)+'%"></i></div></div><div class="act">'+act+'</div></button>';
}
$("grid").innerHTML=h;
$("msg").textContent=S.msg;
$("bBuy").textContent="水を買う ¥"+C.BUYCOST;
$("bBuy").className="btn"+(S.money<C.BUYCOST?" off":"");
$("bNext").textContent=S.day<C.DAYS?"次の日へ":"決算する";
}
function finish(){
var ok=S.win;
$("rIcon").innerHTML=ok?'<circle cx="75" cy="52" r="34" fill="#f2b84b"/><path d="M75 2v12M75 90v12M25 52h12M113 52h12M40 17l8 8M102 79l8 8M110 17l-8 8M48 79l-8 8" stroke="#f2b84b" stroke-width="6" stroke-linecap="round"/><path d="M60 54l11 11 20-23" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
:'<ellipse cx="75" cy="100" rx="46" ry="11" fill="#b98a5a"/><path d="M75 98V56q0-22 24-20" stroke="#8d7b3f" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M99 36q14 4 12 22q-14-4-12-22zM75 70q-18-2-20 14q16 2 20-14z" fill="#b3a05a"/>';
$("rTitle").textContent=ok?"目標達成!":S.bust?"倒産…":"目標未達…";
$("rTitle").className=ok?"":"ng";
$("rSub").textContent=ok?"温室は大繁盛。見事な経営でした":S.bust?"維持費が払えず温室を手放した":"あと ¥"+(C.GOAL-S.money)+"。水やりと出荷を丁寧に";
$("rMoney").textContent="¥"+S.money;
$("rGoal").textContent="¥"+C.GOAL;
$("rShip").textContent=S.shipped+" 株";
$("rRep").textContent="★"+S.best;
$("rDay").textContent=S.day+" 日";
show("result");
}
$("tGoal").textContent=C.GOAL;$("tSeed").textContent=C.SEED;$("tUp").textContent=C.UPKEEP;
$("bStart").onclick=newGame;$("bRetry").onclick=newGame;
$("bBuy").onclick=buyWater;$("bNext").onclick=nextDay;
$("grid").onclick=function(e){var t=e.target;while(t&&t!==this&&!(t.getAttribute&&t.getAttribute("data-i")))t=t.parentNode;if(t&&t!==this)tapPlot(+t.getAttribute("data-i"))};
window.GH={C:C,state:function(){return S},newGame:newGame,tapPlot:tapPlot,buyWater:buyWater,nextDay:nextDay};
})();
</script>
</body>
</html>
