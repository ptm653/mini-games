<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>SKY STACK</title>
<style>
  :root{
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --ink:#f2f6ff;
    --ink-soft:#aeb9d6;
    --accent:#ffd36e;
    --accent2:#7fe3ff;
    --btn-bg:#ffd36e;
    --btn-ink:#20283d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
  }
  body{ position:fixed; inset:0; }

  #app{
    position:fixed;
    inset:0;
    height:100dvh;
    width:100vw;
    overflow:hidden;
    background:linear-gradient(180deg,#10163a 0%, #1b2560 42%, #35306e 72%, #5a3f7a 100%);
  }
  /* decorative stars */
  .stars{ position:absolute; inset:0; pointer-events:none; z-index:0; }
  .star{ position:absolute; background:#fff; border-radius:50%; opacity:.8; }

  /* ===== PLAY AREA ===== */
  #playfield{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
  }
  #stack{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    transition:transform .18s ease-out;
    will-change:transform;
    z-index:1;
  }
  .block{
    position:absolute;
    border-radius:7px;
    box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.22);
  }
  .slice{
    position:absolute;
    border-radius:6px;
    z-index:5;
    will-change:transform,opacity;
  }
  .slice.drop{
    transition:transform .7s cubic-bezier(.4,.1,.7,1), opacity .7s ease-in;
    opacity:0;
  }
  .perfect-burst{
    position:absolute;
    z-index:8;
    color:var(--accent);
    font-weight:800;
    font-size:20px;
    letter-spacing:.06em;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
    pointer-events:none;
    animation:popfade .7s ease-out forwards;
    white-space:nowrap;
  }
  @keyframes popfade{
    0%{ transform:translateY(0) scale(.7); opacity:0; }
    25%{ transform:translateY(-6px) scale(1.1); opacity:1; }
    100%{ transform:translateY(-34px) scale(1); opacity:0; }
  }

  /* ===== TAP LAYER ===== */
  #tap{
    position:absolute;
    inset:0;
    z-index:20;
    background:transparent;
  }

  /* ===== HUD ===== */
  #hud{
    position:absolute;
    top:0; left:0; right:0;
    z-index:30;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:calc(var(--safe-t) + 18px) calc(var(--safe-r) + 20px) 16px calc(var(--safe-l) + 20px);
    pointer-events:none;
  }
  .hud-pill{
    background:rgba(13,18,45,.55);
    backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:10px 16px;
    color:var(--ink);
    line-height:1.3;
  }
  .hud-label{ font-size:12px; color:var(--ink-soft); letter-spacing:.08em; display:block; margin-bottom:2px; }
  .hud-value{ font-size:20px; font-weight:700; }
  .hud-value .accent{ color:var(--accent); }

  /* ===== OVERLAY SCREENS ===== */
  .screen{
    position:absolute;
    inset:0;
    z-index:40;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:calc(var(--safe-t) + 32px) calc(var(--safe-r) + 28px) calc(var(--safe-b) + 36px) calc(var(--safe-l) + 28px);
    background:linear-gradient(180deg, rgba(10,14,34,.72), rgba(20,16,48,.82));
    backdrop-filter:blur(3px);
  }
  .screen.hidden{ display:none; }

  .title-logo{
    font-size:52px;
    font-weight:800;
    letter-spacing:.14em;
    color:var(--ink);
    line-height:1.05;
    text-shadow:0 4px 0 rgba(0,0,0,.22), 0 0 24px rgba(127,227,255,.35);
    margin-bottom:8px;
    padding:0 6px;
  }
  .title-sub{
    font-size:15px;
    color:var(--accent2);
    letter-spacing:.22em;
    margin-bottom:34px;
    padding:0 6px;
  }
  .howto{
    font-size:16px;
    color:var(--ink-soft);
    line-height:1.7;
    max-width:300px;
    margin-bottom:40px;
    padding:0 10px;
  }

  .result-title{
    font-size:46px;
    font-weight:800;
    letter-spacing:.06em;
    line-height:1.15;
    margin-bottom:28px;
    padding:0 8px;
  }
  .result-title.win{ color:var(--accent); text-shadow:0 0 26px rgba(255,211,110,.5); }
  .result-title.lose{ color:#ff8e8e; text-shadow:0 0 22px rgba(255,120,120,.4); }

  .stats{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:40px;
    width:100%;
    max-width:300px;
  }
  .stat-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    padding:14px 20px;
  }
  .stat-row .k{ font-size:16px; color:var(--ink-soft); }
  .stat-row .v{ font-size:16px; font-weight:700; color:var(--ink); }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:220px;
    height:62px;
    padding:0 28px;
    border:none;
    border-radius:16px;
    background:var(--btn-bg);
    color:var(--btn-ink);
    font-size:20px;
    font-weight:800;
    letter-spacing:.08em;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.28), 0 0 22px rgba(255,211,110,.3);
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.28); }
</style>
</head>
<body>
<div id="app">
  <div class="stars" id="stars"></div>

  <div id="playfield">
    <div id="stack"></div>
  </div>

  <div id="tap"></div>

  <div id="hud" class="hidden" aria-hidden="true">
    <div class="hud-pill">
      <span class="hud-label">たかさ</span>
      <span class="hud-value"><span id="hud-h" class="accent">0</span> / <span id="hud-goal">15</span></span>
    </div>
    <div class="hud-pill">
      <span class="hud-label">パーフェクト</span>
      <span class="hud-value"><span id="hud-p">0</span></span>
    </div>
  </div>

  <!-- TITLE -->
  <div id="screen-title" class="screen">
    <div class="title-logo">SKY<br>STACK</div>
    <div class="title-sub">タワーを つみあげろ</div>
    <p class="howto">タップで箱を落として、まっすぐ高く積み上げよう</p>
    <button class="btn" id="btn-start">スタート</button>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen hidden">
    <div id="result-title" class="result-title win">クリア！</div>
    <div class="stats">
      <div class="stat-row"><span class="k">積んだ高さ</span><span class="v"><span id="r-h">0</span> / 15</span></div>
      <div class="stat-row"><span class="k">パーフェクト数</span><span class="v"><span id="r-p">0</span></span></div>
      <div class="stat-row"><span class="k">タイム</span><span class="v"><span id="r-t">0.0</span> 秒</span></div>
    </div>
    <button class="btn" id="btn-retry">もう一度</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---- constants ----
  var GOAL = 15;              // blocks to win
  var BLOCK_H = 34;           // block height px
  var PERFECT_TOL = 6;        // px tolerance for perfect
  var BASE_SPEED = 2.2;
  var SPEED_STEP = 0.18;
  var SPEED_CAP = 7;
  var START_W_RATIO = 0.62;   // starting block width
  var BAND_RATIO = 0.33;      // active block sits near top third

  // ---- dom ----
  var app = document.getElementById('app');
  var stack = document.getElementById('stack');
  var playfield = document.getElementById('playfield');
  var tap = document.getElementById('tap');
  var hud = document.getElementById('hud');
  var hudH = document.getElementById('hud-h');
  var hudP = document.getElementById('hud-p');
  var hudGoal = document.getElementById('hud-goal');
  var screenTitle = document.getElementById('screen-title');
  var screenResult = document.getElementById('screen-result');
  var btnStart = document.getElementById('btn-start');
  var btnRetry = document.getElementById('btn-retry');
  var resultTitle = document.getElementById('result-title');
  var rH = document.getElementById('r-h'), rP = document.getElementById('r-p'), rT = document.getElementById('r-t');

  hudGoal.textContent = GOAL;

  var COLORS = [
    ['#ff8e9e','#ff6a86'],['#ffd36e','#ffb84d'],['#7fe3ff','#4fc8ef'],
    ['#9cff9c','#5fe07a'],['#c79bff','#a173ff'],['#ffb27f','#ff8e4d'],
    ['#8ad0ff','#5ba8ff'],['#ffa3d6','#ff79bf']
  ];

  // ---- state ----
  var state = 'title';   // title | play | over
  var blocks = [];       // {left,width,bottom,el}
  var current = null;    // active sliding block
  var dir = 1;
  var speed = BASE_SPEED;
  var level = 0;
  var perfects = 0;
  var startTime = 0;
  var rafId = null;
  var pw = 0, ph = 0;    // play dimensions

  function measure(){
    pw = playfield.clientWidth;
    ph = playfield.clientHeight;
  }

  function makeStars(){
    var s = document.getElementById('stars');
    var w = window.innerWidth, h = window.innerHeight;
    var frag = document.createDocumentFragment();
    for(var i=0;i<46;i++){
      var d = document.createElement('div');
      d.className='star';
      var sz = Math.random()<0.8 ? 2 : 3;
      d.style.width=sz+'px'; d.style.height=sz+'px';
      d.style.left=(Math.random()*w)+'px';
      d.style.top=(Math.random()*h*0.7)+'px';
      d.style.opacity=(0.35+Math.random()*0.6).toFixed(2);
      frag.appendChild(d);
    }
    s.appendChild(frag);
  }

  function clearStack(){
    stack.innerHTML='';
    stack.style.transform='translateY(0)';
    blocks=[];
    current=null;
  }

  function colorFor(i){ return COLORS[i % COLORS.length]; }

  function styleBlock(el, c){
    el.style.background='linear-gradient(180deg,'+c[0]+','+c[1]+')';
  }

  function addBlockEl(left,width,bottom,colorIdx){
    var el=document.createElement('div');
    el.className='block';
    el.style.left=left+'px';
    el.style.width=width+'px';
    el.style.height=BLOCK_H+'px';
    el.style.bottom=bottom+'px';
    styleBlock(el, colorFor(colorIdx));
    stack.appendChild(el);
    return el;
  }

  function updateCamera(){
    // active block top (in stack coords, measured from stack bottom)
    var topBottom = blocks.length * BLOCK_H; // bottom of the next active block
    var bandY = ph * BAND_RATIO; // distance from top where active band sits
    // We want active block to appear at y=bandY from top of playfield.
    // active block top from playfield-bottom = topBottom + BLOCK_H
    // shift so it lands near the band
    var shift = topBottom + BLOCK_H - (ph - bandY);
    if(shift < 0) shift = 0;
    stack.style.transform='translateY('+shift+'px)';
  }

  function spawnActive(){
    var below = blocks[blocks.length-1];
    var width = below.width;
    var bottom = blocks.length * BLOCK_H;
    // start on alternating side
    var startLeft = (level % 2 === 0) ? 0 : (pw - width);
    dir = (level % 2 === 0) ? 1 : -1;
    var el = addBlockEl(startLeft, width, bottom, blocks.length);
    current = { left:startLeft, width:width, bottom:bottom, el:el };
    speed = Math.min(SPEED_CAP, BASE_SPEED + level*SPEED_STEP);
    updateCamera();
  }

  function startGame(){
    state='play';
    level=0; perfects=0;
    clearStack();
    measure();
    screenTitle.classList.add('hidden');
    screenResult.classList.add('hidden');
    hud.classList.remove('hidden');
    hudH.textContent='0';
    hudP.textContent='0';

    // base block (foundation) - counts as height 1
    var baseW = Math.round(pw * START_W_RATIO);
    var baseLeft = Math.round((pw - baseW)/2);
    var baseEl = addBlockEl(baseLeft, baseW, 0, 0);
    blocks.push({ left:baseLeft, width:baseW, bottom:0, el:baseEl });
    hudH.textContent = blocks.length;

    startTime = performance.now();
    spawnActive();
    loop();
  }

  function loop(){
    if(state!=='play'){ return; }
    if(current){
      current.left += dir*speed;
      if(current.left <= 0){ current.left=0; dir=1; }
      else if(current.left + current.width >= pw){ current.left = pw-current.width; dir=-1; }
      current.el.style.left = current.left+'px';
    }
    rafId = requestAnimationFrame(loop);
  }

  function spawnSlice(left,width,bottom,colorIdx,toLeft){
    var el=document.createElement('div');
    el.className='slice';
    el.style.left=left+'px';
    el.style.width=width+'px';
    el.style.height=BLOCK_H+'px';
    el.style.bottom=bottom+'px';
    styleBlock(el, colorFor(colorIdx));
    stack.appendChild(el);
    // animate falling off
    requestAnimationFrame(function(){
      el.classList.add('drop');
      var dx = toLeft ? -140 : 140;
      el.style.transform='translate(' + dx + 'px, 220px) rotate(' + (toLeft?-40:40) + 'deg)';
    });
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 760);
  }

  function perfectBurst(cx, bottom){
    var b=document.createElement('div');
    b.className='perfect-burst';
    b.textContent='PERFECT!';
    b.style.left=(cx)+'px';
    b.style.bottom=(bottom+BLOCK_H+6)+'px';
    b.style.transform='translateX(-50%)';
    stack.appendChild(b);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 720);
  }

  function dropBlock(){
    if(state!=='play' || !current) return;
    var below = blocks[blocks.length-1];
    var delta = current.left - below.left; // >0 current is to the right

    // overlap
    var newLeft = Math.max(current.left, below.left);
    var newRight = Math.min(current.left+current.width, below.left+below.width);
    var overlap = newRight - newLeft;

    if(overlap <= 0){
      // no overlap -> topple -> game over
      // let the whole block fall
      spawnSlice(current.left, current.width, current.bottom, blocks.length, delta<0);
      current.el.style.display='none';
      endGame(false);
      return;
    }

    var isPerfect = Math.abs(delta) <= PERFECT_TOL;

    if(isPerfect){
      // snap to below, keep full width
      current.left = below.left;
      current.width = below.width;
      current.el.style.left = current.left+'px';
      current.el.style.width = current.width+'px';
      perfects++;
      hudP.textContent = perfects;
      perfectBurst(current.left + current.width/2, current.bottom);
    } else {
      // slice overhang
      if(current.left < below.left){
        // overhang on the left
        spawnSlice(current.left, below.left - current.left, current.bottom, blocks.length, true);
      } else {
        // overhang on the right
        spawnSlice(newRight, (current.left+current.width) - newRight, current.bottom, blocks.length, false);
      }
      current.left = newLeft;
      current.width = overlap;
      current.el.style.left = current.left+'px';
      current.el.style.width = current.width+'px';
    }

    // commit
    blocks.push({ left:current.left, width:current.width, bottom:current.bottom, el:current.el });
    current = null;
    hudH.textContent = blocks.length;

    if(blocks.length >= GOAL){
      endGame(true);
      return;
    }

    level++;
    spawnActive();
  }

  function endGame(win){
    state='over';
    if(rafId) cancelAnimationFrame(rafId);
    var elapsed = (performance.now() - startTime)/1000;
    setTimeout(function(){
      hud.classList.add('hidden');
      resultTitle.textContent = win ? 'クリア！' : 'ゲームオーバー';
      resultTitle.className = 'result-title ' + (win ? 'win' : 'lose');
      rH.textContent = blocks.length;
      rP.textContent = perfects;
      rT.textContent = elapsed.toFixed(1);
      screenResult.classList.remove('hidden');
    }, win ? 260 : 620);
  }

  // ---- input ----
  var lastTap = 0;
  function onTap(e){
    if(state!=='play') return;
    var now = Date.now();
    if(now - lastTap < 120) return; // debounce double-fire (touch+click)
    lastTap = now;
    if(e && e.cancelable) e.preventDefault();
    dropBlock();
  }
  tap.addEventListener('pointerdown', onTap, {passive:false});
  tap.addEventListener('touchstart', onTap, {passive:false});
  tap.addEventListener('click', onTap, {passive:false});

  btnStart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  btnRetry.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

  window.addEventListener('resize', function(){
    measure();
    makeStars && null;
  });

  // prevent scroll gestures entirely
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

  // ---- expose test hooks ----
  window.__sky = {
    getState: function(){ return state; },
    getActive: function(){ return current ? {left:current.left, width:current.width} : null; },
    getBelow: function(){ var b=blocks[blocks.length-1]; return b?{left:b.left,width:b.width}:null; },
    getHeight: function(){ return blocks.length; },
    getPerfects: function(){ return perfects; },
    drop: function(){ dropBlock(); },
    start: function(){ startGame(); },
    pw: function(){ return pw; },
    // test-only helper: directly position the active block (no clamping) for deterministic automated play
    setActiveLeft: function(x){ if(current){ current.left=x; current.el.style.left=x+'px'; } }
  };

  measure();
  makeStars();
})();
</script>
</body>
</html>
